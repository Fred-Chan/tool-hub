<style>
:root{

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);

a{color:inherit}

/* ---------- hero ---------- */
.hero{border-bottom:1px solid var(--line);padding:44px 0 22px;background:var(--bg)}

.stats{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:18px}

  background:var(--card);font-size:14px;outline:none}
#q:focus{border-color:var(--accent)}
/* ---------- layout ---------- */
.layout{display:flex;gap:34px;align-items:flex-start;padding:26px 0 60px}
aside{width:236px;flex:none;position:sticky;top:18px;max-height:calc(100vh - 36px);overflow-y:auto;

aside h4{font-size:11px;letter-spacing:.18em;color:var(--ink2);margin:0 0 8px;font-weight:700}
aside .group{margin-bottom:20px}
aside .group:last-child{margin-bottom:0}
.fitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;
  padding:6px 10px;border-radius:8px;font-size:13.5px;cursor:pointer;color:var(--ink);font-family:inherit}
.fitem:hover{background:#e7e4dc}
.fitem.on{background:var(--ink);color:#fff}
.fitem .cnt{margin-left:auto;font-size:11.5px;color:inherit;opacity:.55}
.fitem.on .cnt{opacity:.8}
.ck{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;font-size:13.5px;cursor:pointer;user-select:none}
.ck:hover{background:#e7e4dc}
.ck input{accent-color:var(--accent);width:15px;height:15px;margin:0;flex:none;cursor:pointer}
.ck .cnt{margin-left:auto;font-size:11.5px;color:var(--ink2)}
.tagpool{display:flex;flex-wrap:wrap;gap:6px}
.tagbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:2.5px 10px;
  font-size:11.5px;cursor:pointer;color:var(--ink2);font-family:inherit;transition:.12s}
.tagbtn:hover{border-color:var(--accent);color:var(--accent)}
.tagbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
main{flex:1;min-width:0}
section{padding:6px 0 18px}
section h2{font-size:19px;font-weight:800;margin:14px 0 12px;display:flex;align-items:baseline;gap:9px}
section h2 small{font-size:12px;color:var(--ink2);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
/* ---------- card ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  display:flex;flex-direction:column;transition:box-shadow .18s,transform .18s}
.card:hover{box-shadow:0 10px 28px rgba(28,27,24,.09);transform:translateY(-2px)}
.shot{aspect-ratio:16/10;background:#efece6;overflow:hidden}
.shot img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#a39e93}
.ph em{font-style:normal;font-size:32px}
.ph span{font-size:11.5px;letter-spacing:.08em}
.body{padding:15px 17px 0;display:flex;flex-direction:column;flex:1}
.titlerow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.date{font-size:11.5px;color:var(--ink2);font-weight:400}
.badge{font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 9px;letter-spacing:.04em}

.b-internal{background:#ece9e2;color:var(--ink2)}
.b-idea{background:#f6efd8;color:var(--gold)}
.b-paused{background:#f7e4e2;color:var(--red)}
.desc{color:#3d3a34;font-size:13px;margin:7px 0 0}
.plist{margin:8px 0 0;padding:0;list-style:none}
.plist li{font-size:12px;color:var(--ink2);padding-left:13px;position:relative;margin:3px 0}
.plist li::before{content:"●";position:absolute;left:0;top:1px;font-size:8px;color:var(--accent)}
.how{font-size:12px;color:var(--ink2);margin:9px 0 0;padding-left:9px;border-left:3px solid var(--line)}
.how b{color:var(--accent2);font-weight:700;margin-right:4px}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin:11px 0 12px}
.tagrow .t{border:1px solid var(--line);background:#faf9f6;border-radius:999px;padding:1.5px 9px;
  font-size:11px;color:var(--ink2);cursor:pointer;font-family:inherit}
.tagrow .t:hover{border-color:var(--accent);color:var(--accent)}
.tagrow .t.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cardfoot{margin-top:auto;border-top:1px dashed var(--line);padding:8px 17px;display:flex;
  align-items:center;justify-content:space-between;gap:10px}
.notebtn{font-size:11.5px;color:var(--ink2);text-decoration:none}
.notebtn:hover{color:var(--accent)}
.siteurl{font-size:12px;font-weight:600;color:var(--accent);text-decoration:none;overflow:hidden;

.siteurl:hover{text-decoration:underline}
.nosite{font-size:11.5px;color:#b6b1a6}
.empty{color:var(--ink2);padding:30px 0;display:none}
footer{border-top:1px solid var(--line);margin-top:10px;padding:24px 0 60px;color:var(--ink2);font-size:12.5px}
footer a{color:var(--accent)}
@media (max-width:920px){
  .layout{flex-direction:column;gap:18px}

</style>

/* ================= 筛选状态与渲染 ================= */
const BADGE = {live:["b-live","已上线"],internal:["b-internal","内部 / 本地"],idea:["b-idea","想法"],paused:["b-paused","挂起"]};
const flomo = id => `https://v.flomoapp.com/mine/?memo_id=${id}`;
const host = u => { try { return new URL(u).host; } catch(e){ return ""; } };
let curCat="all", curTag=null, curQ="";
const statusOn = {live:true, internal:false, idea:false, paused:false}; /* 复选框：默认只显示已上线 */

/* 侧边栏 */
function renderSide(){
  const catCnt = {}, stCnt = {}, tagCnt = {};
  for(const t of TOOLS){
    catCnt[t.c]=(catCnt[t.c]||0)+1;
    stCnt[t.s]=(stCnt[t.s]||0)+1;
    for(const g of (t.tags||[])) tagCnt[g]=(tagCnt[g]||0)+1;
  }
  const tags = Object.entries(tagCnt).filter(([,n])=>n>=2).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],"zh"));
  document.getElementById("side").innerHTML = `
  <div class="group"><h4>分类 · CATEGORIES</h4>
    <button class="fitem ${curCat==="all"?"on":""}" data-k="cat" data-v="all">✦ 全部<span class="cnt">${TOOLS.length}</span></button>
    ${CATS.map(c=>`<button class="fitem ${curCat===c.id?"on":""}" data-k="cat" data-v="${c.id}">${c.icon} ${c.name}<span class="cnt">${catCnt[c.id]||0}</span></button>`).join("")}
  </div>
  <div class="group"><h4>状态 · STATUS</h4>
    ${STATUSES.filter(s=>s.id==="live"||(stCnt[s.id]||0)>0).map(s=>`<label class="ck"><input type="checkbox" data-st="${s.id}" ${statusOn[s.id]?"checked":""}> ${s.name}<span class="cnt">${stCnt[s.id]||0}</span></label>`).join("")}
  </div>
  <div class="group"><h4>标签 · TAGS</h4>
    <div class="tagpool">${tags.map(([g,n])=>`<button class="tagbtn ${curTag===g?"on":""}" data-k="tag" data-v="${g}">${g} ${n}</button>`).join("")}</div>
  </div>`;
}
document.getElementById("side").addEventListener("click",e=>{
  const b = e.target.closest("[data-k]"); if(!b) return;
  const {k,v} = b.dataset;
  if(k==="cat") curCat=v;
  else if(k==="tag") curTag = (curTag===v?null:v);
  render();
});
document.getElementById("side").addEventListener("change",e=>{
  const cb = e.target.closest("input[data-st]"); if(!cb) return;
  statusOn[cb.dataset.st] = cb.checked;
  render();
});

/* 卡片 */
function card(t){
  const [bc,bt] = BADGE[t.s]||BADGE.internal;
  const shot = t.shot
    ? `<div class="shot"><img loading="lazy" src="screenshots/${t.shot}" alt="${t.n} 界面截图" onerror="this.parentNode.innerHTML='<div class=\\'ph\\'><em>🧰</em><span>暂无截图</span></div>'"></div>`
    : `<div class="shot"><div class="ph"><em>${t.s==="idea"?"💡":"🧰"}</em><span>${t.s==="idea"?"想法 · 暂无界面":"内部工具 · 暂无公开界面"}</span></div></div>`;
  const notes = (t.notes||[]).map(x=>`<a class="notebtn" href="${flomo(x.id)}" target="_blank" rel="noopener">✎ ${x.t}</a>`).join(" · ");
  const foot = t.url
    ? `<a class="siteurl" href="${t.url}" target="_blank" rel="noopener" title="${t.url}">${host(t.url)} ↗</a>`
    : `<span class="nosite">${t.s==="idea"?"想法 · 未上线":"内部工具"}</span>`;
  const listHtml = (t.list&&t.list.length) ? `<ul class="plist">${t.list.map(x=>`<li>${x}</li>`).join("")}</ul>` : "";
  return `<article class="card" data-c="${t.c}">
    ${shot}
    <div class="body">
      <div class="titlerow"><h3>${t.n}</h3><span class="badge ${bc}">${bt}</span><span class="date">${t.d}</span></div>
      <p class="desc">${t.desc}</p>
      ${listHtml}
      <p class="how"><b>怎么用</b>${t.how}</p>
      <div class="tagrow">${(t.tags||[]).map(g=>`<button class="t ${curTag===g?"on":""}" data-k="tag" data-v="${g}">${g}</button>`).join("")}</div>
    </div>
    <div class="cardfoot"><span class="notewrap">${notes||'<span class="nosite">无笔记</span>'}</span>${foot}</div>
  </article>`;
}

function render(){
  renderSide();
  const filtered = TOOLS.filter(t=>
    statusOn[t.s] &&
    (curCat==="all"||t.c===curCat) &&
    (!curTag || (t.tags||[]).includes(curTag)) &&
    (!curQ || (t.n+t.desc+t.how+(t.tags||[]).join()+(t.list||[]).join()).toLowerCase().includes(curQ)));
  let html="", shown=0;
  for(const cat of CATS){
    const items = filtered.filter(t=>t.c===cat.id);
    if(!items.length) continue;
    shown += items.length;
    html += `<section><h2>${cat.icon} ${cat.name}<small>${items.length} 项</small></h2>
      <div class="grid">${items.map(card).join("")}</div></section>`;
  }
  document.getElementById("main").innerHTML = html;
  document.getElementById("empty").style.display = shown?"none":"block";
  document.getElementById("stats").innerHTML =
    `<div><b>${TOOLS.length}</b><span>条目</span></div>
     <div><b>${TOOLS.filter(t=>t.s==="live").length}</b><span>已上线</span></div>
     <div><b>${TOOLS.filter(t=>t.shot).length}</b><span>含截图</span></div>
     <div><b>${new Set(TOOLS.flatMap(t=>t.tags||[])).size}</b><span>个标签</span></div>`;
}
document.getElementById("q").addEventListener("input",e=>{curQ=e.target.value.trim().toLowerCase();render();});
render();
</script>
